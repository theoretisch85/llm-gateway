<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">llm-gateway admin console preview</title>
  <desc id="desc">Compact llm-gateway admin dashboard with sidebar navigation, system telemetry, worker and reviewer model cards, pipeline status, GPU telemetry, and quick links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B10"/>
      <stop offset="0.58" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#05080C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121923"/>
      <stop offset="1" stop-color="#0D131A"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15362E"/>
      <stop offset="1" stop-color="#10271F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#17202B" stroke-width="1" opacity="0.75"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;}
      .label{fill:#8194A7;font-size:16px;letter-spacing:1.7px;font-weight:700;text-transform:uppercase;}
      .small{fill:#8194A7;font-size:15px;letter-spacing:1px;}
      .value{fill:#75E6B4;font-size:25px;font-weight:800;}
      .title{fill:#D9E6F2;font-size:20px;font-weight:800;letter-spacing:1.4px;}
      .chip{fill:#75E6B4;font-size:18px;font-weight:800;}
      .muted{fill:#8194A7;font-size:16px;}
      .nav{fill:#C7D3DF;font-size:18px;font-weight:800;letter-spacing:2.2px;}
      .status{fill:#FFE0E0;font-size:13px;font-weight:900;letter-spacing:1px;}
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)" opacity="0.55"/>

  <rect x="0" y="0" width="248" height="980" fill="#070C11" stroke="#233142"/>
  <text x="26" y="42" class="mono" fill="#75E6B4" font-size="22" font-weight="900" letter-spacing="5">LLM-GATEWAY</text>
  <text x="26" y="75" class="mono small">KAI ADMIN WORKSPACE</text>
  <line x1="0" y1="105" x2="248" y2="105" stroke="#233142"/>

  <g class="mono">
    <rect x="18" y="136" width="212" height="40" rx="5" fill="url(#active)" stroke="#3C846A"/>
    <text x="32" y="162" class="nav" fill="#75E6B4">DASHBOARD</text>
    <rect x="18" y="188" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="214" class="nav">STATUS</text>
    <rect x="18" y="240" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="266" class="nav">CHAT</text>
    <rect x="18" y="292" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="318" class="nav">MAIL</text>
    <rect x="18" y="344" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="370" class="nav">HOME ASSISTANT</text>
    <rect x="18" y="396" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="422" class="nav">MEMORY</text>
    <rect x="18" y="448" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="474" class="nav">STORAGE</text>
    <rect x="18" y="500" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="526" class="nav">SKILLS / MCP</text>
    <rect x="18" y="552" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="578" class="nav">DATABASE</text>
    <rect x="18" y="604" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="630" class="nav">OPS</text>
    <rect x="18" y="656" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="682" class="nav">PI / DEVICES</text>
    <rect x="18" y="708" width="212" height="40" rx="5" fill="#111923" stroke="#293848"/><text x="32" y="734" class="nav">SETTINGS</text>
  </g>

  <rect x="248" y="0" width="1352" height="74" fill="#0B1118" stroke="#263544"/>
  <text x="276" y="30" class="mono" fill="#75E6B4" font-size="20" font-weight="900" letter-spacing="4">SYSTEM MONITOR</text>
  <text x="276" y="53" class="mono small">Gateway / MI50 / Kai</text>
  <g class="mono">
    <rect x="1168" y="12" width="70" height="38" rx="6" fill="#101722" stroke="#2B3B4F"/><text x="1178" y="27" class="small" font-size="10">CPU</text><text x="1178" y="43" class="chip" font-size="15">30.3%</text>
    <rect x="1248" y="12" width="82" height="38" rx="6" fill="#101722" stroke="#2B3B4F"/><text x="1258" y="27" class="small" font-size="10">CPU TEMP</text><text x="1258" y="43" class="chip" font-size="15">50.0 C</text>
    <rect x="1340" y="12" width="96" height="38" rx="6" fill="#101722" stroke="#2B3B4F"/><text x="1350" y="27" class="small" font-size="10">GPU USE</text><text x="1350" y="43" class="chip" font-size="15">G0 0%/G1 0%</text>
    <rect x="1446" y="12" width="92" height="38" rx="6" fill="#101722" stroke="#2B3B4F"/><text x="1456" y="27" class="small" font-size="10">GPU TEMP</text><text x="1456" y="43" class="chip" font-size="15">G0 36/G1 34</text>
  </g>

  <g class="mono" transform="translate(278 116)">
    <g>
      <rect width="210" height="112" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">Gateway</text><rect x="151" y="16" width="54" height="18" rx="4" fill="#FFE0E0"/><text x="158" y="29" class="status" fill="#983333">CHECK</text>
      <text x="14" y="62" class="value">ok</text><text x="14" y="88" class="muted">API bereit</text>
    </g>
    <g transform="translate(222 0)">
      <rect width="210" height="112" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">Worker</text><rect x="151" y="16" width="54" height="18" rx="4" fill="#DFF7EB"/><text x="160" y="29" class="status" fill="#173C2D">ONLINE</text>
      <text x="14" y="62" class="value">devstral-q3</text><text x="14" y="88" class="muted">fast / GPU0 / 8080</text>
    </g>
    <g transform="translate(444 0)">
      <rect width="210" height="112" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">Reviewer</text><rect x="151" y="16" width="54" height="18" rx="4" fill="#DFF7EB"/><text x="160" y="29" class="status" fill="#173C2D">ONLINE</text>
      <text x="14" y="62" class="value">reviewer</text><text x="14" y="88" class="muted">GPU1 / 8081</text>
    </g>
    <g transform="translate(666 0)">
      <rect width="210" height="112" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">Pipeline</text><rect x="151" y="16" width="54" height="18" rx="4" fill="#DFF7EB"/><text x="160" y="29" class="status" fill="#173C2D">READY</text>
      <text x="14" y="62" class="value">reviewed-chat</text><text x="14" y="88" class="muted">max 2 LLM calls</text>
    </g>
    <g transform="translate(888 0)">
      <rect width="210" height="112" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">Requests</text><text x="14" y="62" class="value">19</text><text x="14" y="88" class="muted">Backend 6</text>
    </g>
    <g transform="translate(1110 0)">
      <rect width="210" height="112" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">Uptime</text><text x="14" y="62" class="value">104.37</text><text x="14" y="88" class="muted">Avg 238.36 ms</text>
    </g>
  </g>

  <g class="mono" transform="translate(278 248)">
    <g>
      <rect width="320" height="106" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">GPU Temp</text><text x="14" y="63" class="value">G0 36C</text><text x="14" y="89" class="value">G1 34C</text>
    </g>
    <g transform="translate(334 0)">
      <rect width="320" height="106" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">GPU Power</text><text x="14" y="63" class="value">G0 15W</text><text x="14" y="89" class="value">G1 17W</text>
    </g>
    <g transform="translate(668 0)">
      <rect width="320" height="106" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">VRAM</text><text x="14" y="63" class="value">G0 67%</text><text x="14" y="89" class="value">G1 67%</text>
    </g>
    <g transform="translate(1002 0)">
      <rect width="320" height="106" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
      <text x="14" y="28" class="label">MCP / Skills</text><text x="14" y="63" class="value">22 / 0</text><text x="14" y="89" class="muted">controlled tools</text>
    </g>
  </g>

  <g class="mono" transform="translate(278 378)">
    <rect width="1320" height="64" rx="5" fill="url(#panel)" stroke="#2B3B4F"/>
    <text x="14" y="24" class="label">Schnellzugriff</text>
    <g font-size="15" font-weight="800" letter-spacing="1.2">
      <rect x="14" y="34" width="58" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="25" y="51" fill="#D9E6F2">CHAT</text>
      <rect x="82" y="34" width="72" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="93" y="51" fill="#D9E6F2">STATUS</text>
      <rect x="164" y="34" width="78" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="175" y="51" fill="#D9E6F2">MEMORY</text>
      <rect x="252" y="34" width="58" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="264" y="51" fill="#D9E6F2">MAIL</text>
      <rect x="320" y="34" width="86" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="331" y="51" fill="#D9E6F2">STORAGE</text>
      <rect x="416" y="34" width="98" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="427" y="51" fill="#D9E6F2">DATABASE</text>
      <rect x="524" y="34" width="48" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="536" y="51" fill="#D9E6F2">OPS</text>
      <rect x="582" y="34" width="88" height="24" rx="4" fill="#172130" stroke="#2C3D51"/><text x="593" y="51" fill="#D9E6F2">SETTINGS</text>
    </g>
  </g>

  <g class="mono" transform="translate(278 486)">
    <rect width="1320" height="360" rx="5" fill="#0A0F15" stroke="#233142" opacity="0.95"/>
    <text x="20" y="42" fill="#75E6B4" font-size="24" font-weight="900" letter-spacing="2.2">STATUS / MODEL PROFILES</text>
    <line x1="20" y1="66" x2="1300" y2="66" stroke="#233142"/>
    <text x="20" y="104" class="label">Profil</text><text x="280" y="104" class="label">Modell</text><text x="560" y="104" class="label">Backend</text><text x="900" y="104" class="label">Status</text><text x="1080" y="104" class="label">Latenz</text>
    <line x1="20" y1="125" x2="1300" y2="125" stroke="#233142"/>
    <text x="20" y="164" class="title">fast</text><text x="280" y="164" class="muted">devstral-q3</text><text x="560" y="164" class="muted">GPU0 :8080</text><text x="900" y="164" class="value">online</text><text x="1080" y="164" class="muted">120 ms</text>
    <line x1="20" y1="190" x2="1300" y2="190" stroke="#1B2735"/>
    <text x="20" y="230" class="title">reviewer</text><text x="280" y="230" class="muted">reviewer</text><text x="560" y="230" class="muted">GPU1 :8081</text><text x="900" y="230" class="value">online</text><text x="1080" y="230" class="muted">140 ms</text>
    <line x1="20" y1="256" x2="1300" y2="256" stroke="#1B2735"/>
    <text x="20" y="304" class="muted">OpenAI-compatible API</text><text x="360" y="304" class="muted">model profiles</text><text x="670" y="304" class="muted">Gmail readonly</text><text x="980" y="304" class="muted">Home Assistant</text>
  </g>

  <circle cx="1516" cy="902" r="56" fill="#75E6B4" opacity="0.10" filter="url(#glow)"/>
  <text x="1439" y="908" class="mono" fill="#75E6B4" font-size="18" font-weight="900" letter-spacing="2">KAI READY</text>
</svg>
